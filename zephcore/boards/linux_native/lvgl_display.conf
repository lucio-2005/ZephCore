# LVGL touch UI on native_sim (SDL window, mouse as touch).
#
# Add after a device preset; pairs with lvgl_display.overlay:
#   -DEXTRA_CONF_FILE="boards/linux_native/femtofox.conf;boards/linux_native/lvgl_display.conf"
# Needs the SDL2 development package on the build host (libsdl2-dev).

CONFIG_DISPLAY=y
CONFIG_INPUT=y
CONFIG_LVGL=y
CONFIG_ZEPHCORE_UI_DESIGN_LVGL=y

# LVGL runs on the main thread from the mesh loop (helpers/ui-lvgl).
CONFIG_LV_Z_AUTO_INIT=y
CONFIG_LV_Z_RUN_LVGL_ON_WORKQUEUE=n

# The home screen stays in memory (~95 KB); a second screen with a panel on
# top peaks near 125 KB. LVGL crashes rather than fails when this runs out.
CONFIG_LV_Z_MEM_POOL_SIZE=262144
CONFIG_LV_Z_VDB_SIZE=25
CONFIG_MAIN_STACK_SIZE=8192

CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_BUTTON=y
CONFIG_LV_USE_BAR=y
CONFIG_LV_USE_SLIDER=y
CONFIG_LV_USE_SWITCH=y
CONFIG_LV_USE_DROPDOWN=y
CONFIG_LV_USE_TEXTAREA=y
CONFIG_LV_USE_KEYBOARD=y
CONFIG_LV_USE_BUTTONMATRIX=y
CONFIG_LV_USE_TABVIEW=y
CONFIG_LV_USE_FLEX=y
CONFIG_LV_USE_THEME_DEFAULT=y
